name: Validate and Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b163a0ea817f44817e4a7820802

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@e7a5f9b97110f6ee63171e7939cf686b46b33b65
        with:
          hugo-version: '0.169.0'
          extended: true

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks

      - name: Content validation
        run: ./scripts/validate-content.sh

      - name: Markdown linting
        run: markdownlint '**/*.md'

      - name: Hugo build
        run: hugo --gc --cleanDestinationDir --minify

      - name: Link validation
        run: ./scripts/validate-links.sh

      - name: Secret scanning
        run: gitleaks protect --source . --verbose --no-banner

  deploy:
    name: Deploy
    needs: validate
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b163a0ea817f44817e4a7820802

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@e7a5f9b97110f6ee63171e7939cf686b46b33b65
        with:
          hugo-version: '0.169.0'
          extended: true

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Content validation
        run: ./scripts/validate-content.sh

      - name: Markdown linting
        run: markdownlint '**/*.md'

      - name: Hugo build
        run: hugo --gc --cleanDestinationDir --minify
        env:
          HUGO_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@f47175f3687421e9613e11e4757c1e540c663a13
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@53908604e1b6d775b83c99b0e68c2b869b618994
