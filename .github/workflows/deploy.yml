name: Validate and Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.169.0'
          extended: true

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks

      - name: Content validation
        run: ./scripts/validate-content.sh

      - name: Markdown linting
        run: markdownlint '**/*.md'

      - name: Hugo build
        run: hugo --gc --cleanDestinationDir --minify

      - name: Link validation
        run: ./scripts/validate-links.sh

      - name: Secret scanning
        run: gitleaks protect --source . --verbose --no-banner

  deploy:
    name: Deploy
    needs: validate
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.169.0'
          extended: true

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Content validation
        run: ./scripts/validate-content.sh

      - name: Markdown linting
        run: markdownlint '**/*.md'

      - name: Hugo build
        run: hugo --gc --cleanDestinationDir --minify
        env:
          HUGO_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@f33f41b675f0ab2dc5a6863c9a170fe83af3571e # v4.0.0
